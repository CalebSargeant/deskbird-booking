site_name: Deskbird Booking Automation
site_description: Automated Deskbird desk booking via Selenium, Microsoft SSO, and a Kubernetes CronJob
repo_url: https://github.com/CalebSargeant/deskbird-booking
repo_name: CalebSargeant/deskbird-booking

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Setup & Deployment: setup.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
