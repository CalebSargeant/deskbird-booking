apiVersion: batch/v1
kind: CronJob
metadata:
  name: deskbird-booking
spec:
  # Runs 01:00 Monday and Thursday, office-local. timeZone must stay set: without it the
  # controller-manager's own clock decides, which fired 01:00 CEST = 23:00 UTC the previous
  # day, and the container (UTC) then booked Sundays/Wednesdays instead of Mondays/Thursdays.
  schedule: "0 1 * * 1,4"
  timeZone: "Europe/Amsterdam"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retry a couple of times for transient SSO/network hiccups, but don't
      # hammer the Microsoft login on hard failures.
      backoffLimit: 2
      # Hard wall-clock cap so a hung Selenium run (e.g. a stalled page load)
      # is killed within 15 minutes instead of lingering for days.
      activeDeadlineSeconds: 900
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-pull-secret
          containers:
          - name: deskbird-booking
            image: ghcr.io/calebsargeant/deskbird-booking:latest
            imagePullPolicy: Always
            env:
            # Guard rail: each run books 7 days ahead, so only Monday/Thursday runs book.
            # Keep in sync with the schedule above.
            - name: BOOKING_WEEKDAYS
              value: "mon,thu"
            # Must match spec.timeZone - the script resolves dates in this zone, not the
            # container's UTC clock.
            - name: BOOKING_TIMEZONE
              value: "Europe/Amsterdam"
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OP_SERVICE_ACCOUNT_TOKEN
            - name: OP_ITEM_NAME
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OP_ITEM_NAME
            - name: OP_VAULT
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OP_VAULT
            - name: OFFICE_ID
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OFFICE_ID
            - name: FLOOR_ID
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: FLOOR_ID
            - name: PREFERRED_DESK
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: PREFERRED_DESK
            resources:
              requests:
                memory: "512Mi"
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "0.75"
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 512Mi
          restartPolicy: OnFailure
