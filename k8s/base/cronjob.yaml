apiVersion: batch/v1
kind: CronJob
metadata:
  name: deskbird-booking
spec:
  schedule: "0 1 * * 1,4"  # Run every Monday and Thursday at 1 AM UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retry a couple of times for transient SSO/network hiccups, but don't
      # hammer the Microsoft login on hard failures.
      backoffLimit: 2
      # Hard wall-clock cap so a hung Selenium run (e.g. a stalled page load)
      # is killed within 15 minutes instead of lingering for days.
      activeDeadlineSeconds: 900
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-pull-secret
          containers:
          - name: deskbird-booking
            image: ghcr.io/calebsargeant/deskbird-booking:latest
            imagePullPolicy: Always
            env:
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OP_SERVICE_ACCOUNT_TOKEN
            - name: OP_ITEM_NAME
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OP_ITEM_NAME
            - name: OP_VAULT
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OP_VAULT
            - name: OFFICE_ID
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: OFFICE_ID
            - name: FLOOR_ID
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: FLOOR_ID
            - name: PREFERRED_DESK
              valueFrom:
                secretKeyRef:
                  name: deskbird-credentials
                  key: PREFERRED_DESK
            resources:
              requests:
                memory: "512Mi"
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "0.75"
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 512Mi
          restartPolicy: OnFailure
