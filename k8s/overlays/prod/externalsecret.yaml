# Vault entry deskbird-credentials is one JSON object; each property below is one of its keys.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: deskbird-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: deskbird-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: OP_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: deskbird-credentials
        property: OP_SERVICE_ACCOUNT_TOKEN
    - secretKey: OP_ITEM_NAME
      remoteRef:
        key: deskbird-credentials
        property: OP_ITEM_NAME
    - secretKey: OP_VAULT
      remoteRef:
        key: deskbird-credentials
        property: OP_VAULT
    - secretKey: OFFICE_ID
      remoteRef:
        key: deskbird-credentials
        property: OFFICE_ID
    - secretKey: FLOOR_ID
      remoteRef:
        key: deskbird-credentials
        property: FLOOR_ID
    - secretKey: PREFERRED_DESK
      remoteRef:
        key: deskbird-credentials
        property: PREFERRED_DESK
